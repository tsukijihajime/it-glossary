<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT用語やさしい辞典</title>
<meta name="description" content="新入社員や非エンジニアの方向けの、やさしい言葉で説明するIT用語辞典です。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">IT用語やさしい辞典</h1>
    <div class="search">
      <label for="search" class="visually-hidden">用語を検索</label>
      <input id="search" type="search" placeholder="用語を入力（例：クラウド、API）" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap">
  <div id="message" class="message" role="alert" hidden></div>

  <section id="today" class="today" aria-labelledby="today-label" hidden>
    <h2 id="today-label" class="today-label">今日の用語</h2>
    <button type="button" id="today-btn" class="today-btn"></button>
  </section>

  <nav id="tabs" class="tabs" aria-label="分野"></nav>

  <div class="filters">
    <span class="filter-label">難易度</span>
    <div id="levels" class="levels"></div>
    <label class="check"><input type="checkbox" id="fav-only"> お気に入りのみ</label>
  </div>

  <nav id="index-bar" class="index-bar" aria-label="頭文字で絞り込み"></nav>

  <p id="count" class="count" aria-live="polite"></p>
  <ul id="grid" class="grid"></ul>

  <details class="data-menu">
    <summary>データの入出力</summary>
    <div class="data-body">
      <h3>インポート</h3>
      <p class="note">JSON（用語の配列）または CSV ファイルを選ぶと、このブラウザに追加で保存されます。同じ ID の用語は上書きされます。</p>
      <input id="import-file" type="file" accept=".json,.csv" aria-label="インポートするファイル">
      <h3>エクスポート</h3>
      <div class="btn-row">
        <button type="button" data-export="all-json">全件 JSON</button>
        <button type="button" data-export="all-csv">全件 CSV</button>
        <button type="button" data-export="view-json">表示中 JSON</button>
        <button type="button" data-export="view-csv">表示中 CSV</button>
      </div>
      <h3>ローカル追加分</h3>
      <button type="button" id="clear-local" class="danger">ローカル追加分をすべて削除</button>
    </div>
  </details>
</main>

<footer class="site-footer wrap">IT用語やさしい辞典</footer>

<dialog id="detail" aria-labelledby="d-term">
  <div class="d-inner">
    <div class="d-head">
      <div>
        <h2 id="d-term"></h2>
        <p id="d-reading" class="reading"></p>
        <p id="d-full" class="full"></p>
      </div>
      <button type="button" id="d-close" class="icon-btn" aria-label="閉じる">×</button>
    </div>
    <p class="meta"><span id="d-cat" class="chip"></span> <span id="d-level" class="level"></span></p>
    <p id="d-desc" class="d-desc"></p>
    <div id="d-analogy-wrap"><h3>例えるなら</h3><p id="d-analogy"></p></div>
    <div id="d-example-wrap"><h3>使用例</h3><p id="d-example"></p></div>
    <div id="d-related-wrap">
      <h3>関連用語</h3>
      <div id="d-related" class="btn-row"></div>
    </div>
    <div class="btn-row d-actions">
      <button type="button" id="d-fav"></button>
      <button type="button" id="d-copy">URLをコピー</button>
      <button type="button" id="d-delete" class="danger" hidden>この用語をローカルから削除</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
